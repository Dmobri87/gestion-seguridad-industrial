# =============================================================================
# Docker Compose - Development Override
# Sistema de Gestion de Seguridad Industrial y Salud Ocupacional
# =============================================================================
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# This file overrides production settings for local development:
#   - Backend: hot-reload enabled, port 8002, source code mounted
#   - Frontend: Vite dev server on port 3000 instead of Nginx
#   - Database: port 5432 exposed for local tools (pgAdmin, DBeaver, etc.)
#   - Redis: port 6379 exposed for local inspection
#
# =============================================================================

services:
  # ===========================================================================
  # Database - Expose port for local tools
  # ===========================================================================
  db:
    ports:
      - "5432:5432"

  # ===========================================================================
  # Redis - Expose port for local inspection
  # ===========================================================================
  redis:
    ports:
      - "6379:6379"

  # ===========================================================================
  # Backend - Development mode with hot-reload
  # ===========================================================================
  backend:
    ports:
      - "8002:8000"
    volumes:
      - ./backend/app:/app/app
      - upload_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "True"
      REDIS_URL: redis://redis:6379/0

  # ===========================================================================
  # Frontend - Vite dev server (replaces Nginx)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      NODE_ENV: development
