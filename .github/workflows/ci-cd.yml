name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # -------------------------------------------------------
  # Job 1: Test Backend
  # -------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "test-secret-key-for-ci-cd-pipeline-minimum-32-chars"
      DATABASE_URL: "sqlite:///./test.db"
      DEBUG: "True"
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run linting (flake8)
        run: |
          pip install flake8
          cd backend && flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run type checking (mypy) - informational
        continue-on-error: true
        run: |
          pip install mypy types-redis
          cd backend && mypy app --ignore-missing-imports --no-error-summary || true

      - name: Verify backend imports and starts
        run: |
          cd backend && python -c "from app.main import app; print('Backend OK')"

      - name: Run unit tests with pytest
        run: |
          cd backend && python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Check for security vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2022-43012 || true

  # -------------------------------------------------------
  # Job 2: Test Frontend
  # -------------------------------------------------------
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run ESLint
        run: cd frontend && npm run lint

      - name: Run TypeScript type check
        run: cd frontend && npx tsc --noEmit

      - name: Run unit tests (if script exists)
        run: |
          cd frontend
          if npm run | grep -q " test"; then
            npm test -- --passWithNoTests --watchAll=false
          else
            echo "No test script defined in package.json"
          fi

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Verify build output exists
        run: |
          if [ -d "frontend/dist" ] || [ -d "frontend/build" ] || [ -d "frontend/.next" ]; then
            echo "Frontend build succeeded"
            ls -la frontend/dist/ 2>/dev/null || ls -la frontend/build/ 2>/dev/null || true
          else
            echo "ERROR: No build output directory found"
            exit 1
          fi

      - name: Check bundle size
        run: |
          if [ -d "frontend/dist" ]; then
            echo "Bundle sizes:"
            du -sh frontend/dist/*
            find frontend/dist -name "*.js" -exec du -h {} \; | sort -rh | head -10
          fi

  # -------------------------------------------------------
  # Job 3: Build and Push Docker Images
  # -------------------------------------------------------
  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA short
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Job 4: Deploy to Production
  # -------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://${{ secrets.SSH_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "==> Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pulling latest images..."
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker pull ${{ env.FRONTEND_IMAGE }}:latest

            echo "==> Navigating to project directory..."
            cd ~/gestion_proyectos

            echo "==> Starting services with docker-compose..."
            docker-compose up -d

            echo "==> Waiting for services to start..."
            sleep 10

            echo "==> Running health check..."
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$HEALTH_STATUS" -eq 200 ]; then
              echo "Health check PASSED (HTTP $HEALTH_STATUS)"
            else
              echo "Health check FAILED (HTTP $HEALTH_STATUS)"
              docker-compose logs --tail=50
              exit 1
            fi

            echo "==> Deployment completed successfully"
