# Alembic Configuration File
# Configuracion de migraciones para el Sistema de Gestion de Seguridad Industrial

[alembic]
# Directorio de migraciones
script_location = alembic

# Template para nuevos archivos de migracion
# file_template = %%(rev)s_%%(slug)s

# La URL de la base de datos se configura dinamicamente en env.py
# desde la variable de entorno DATABASE_URL
# sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
