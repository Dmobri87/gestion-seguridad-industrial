# =============================================================================
# Nginx Production Configuration - HTTPS/SSL
# Sistema de Gestion de Seguridad Industrial
# =============================================================================
#
# IMPORTANTE: Antes de desplegar, ejecutar el siguiente comando para
# reemplazar YOUR_DOMAIN con su dominio real:
#
#   DOMAIN="midominio.com" && sed -i "s/YOUR_DOMAIN/$DOMAIN/g" nginx/nginx.prod.conf
#
# O en Windows PowerShell:
#   $DOMAIN="midominio.com"; (Get-Content nginx/nginx.prod.conf) -replace 'YOUR_DOMAIN', $DOMAIN | Set-Content nginx/nginx.prod.conf
#
# Mount this file to /etc/nginx/nginx.conf in the nginx container.
# =============================================================================

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # =========================================================================
    # Basic Settings
    # =========================================================================
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # =========================================================================
    # File Upload Limit (50 MB)
    # =========================================================================
    client_max_body_size 50M;
    client_body_buffer_size 2M;

    # =========================================================================
    # Rate Limiting Zones
    # =========================================================================
    # General requests: 10 requests/second per IP with burst
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # API endpoints: 20 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # Login/auth: 3 requests/second per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

    # File uploads: 2 requests/second per IP
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=2r/s;

    limit_req_status 429;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        application/x-font-woff;

    # =========================================================================
    # WebSocket Support (upgrade mapping)
    # =========================================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =========================================================================
    # SSL Session Settings (shared across all server blocks)
    # =========================================================================
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # =========================================================================
    # Upstream Backend
    # =========================================================================
    upstream backend_service {
        server backend:8000;
        keepalive 32;
    }

    # =========================================================================
    # Server Block: HTTP -> HTTPS Redirect (Port 80)
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;

        # Let's Encrypt ACME challenge (required for certificate issuance/renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Server Block: HTTPS (Port 443)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;

        # =====================================================================
        # SSL Certificate Paths (Let's Encrypt)
        # =====================================================================
        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

        # =====================================================================
        # SSL Protocol & Cipher Configuration
        # =====================================================================
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Diffie-Hellman parameter (generate with: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
        # Uncomment the line below after generating the file:
        # ssl_dhparam /etc/nginx/dhparam.pem;

        # =====================================================================
        # Security Headers
        # =====================================================================
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Content Security Policy - Endurecido para React/Vite
        # Nota: 'unsafe-inline' en style-src es necesario para Ant Design
        # En producción, considere usar nonces para scripts si es posible
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.YOUR_DOMAIN; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # =====================================================================
        # Frontend: Serve Static Files (React SPA)
        # =====================================================================
        root /usr/share/nginx/html;
        index index.html;

        # Static assets: aggressive caching (Vite uses content-hashed filenames)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Cache other static file types
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # index.html: never cache (users always get the latest version)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # =====================================================================
        # Proxy: Authentication / Login API (stricter rate limit)
        # =====================================================================
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://backend_service/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # =====================================================================
        # Proxy: General API Requests
        # =====================================================================
        location /api/v1/ {
            limit_req zone=api burst=40 nodelay;

            proxy_pass http://backend_service/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # =====================================================================
        # Proxy: Uploaded Files Served by Backend
        # =====================================================================
        location /uploads/ {
            limit_req zone=uploads burst=5 nodelay;

            proxy_pass http://backend_service/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # =====================================================================
        # WebSocket Support (for future real-time features)
        # =====================================================================
        location /ws/ {
            proxy_pass http://backend_service/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # =====================================================================
        # SPA Fallback: Serve index.html for All Unknown Routes
        # =====================================================================
        location / {
            limit_req zone=general burst=20 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # =====================================================================
        # Deny Access to Hidden Files
        # =====================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # =====================================================================
        # Custom Error Pages
        # =====================================================================
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
